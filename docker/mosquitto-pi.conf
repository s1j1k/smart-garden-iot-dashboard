# Optional Pi host install helper for Mosquitto.
# On a Raspberry Pi running Mosquitto via apt (not Docker):
#
#   sudo cp docker/mosquitto-pi.conf /etc/mosquitto/conf.d/smart-garden.conf
#   sudo systemctl restart mosquitto
#
# Then point the ESP32 secrets.h MQTT_BROKER_HOST at this Pi's LAN IP,
# e.g. 192.168.1.50 — not "localhost" and preferably not ".local" mDNS.

listener 1883 0.0.0.0
allow_anonymous true
