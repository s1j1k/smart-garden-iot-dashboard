# Smart Garden Mosquitto broker — accept ESP32 clients on the LAN.
# Used by Docker and can be copied to a Raspberry Pi at:
#   /etc/mosquitto/conf.d/smart-garden.conf

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
persistence false
connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
