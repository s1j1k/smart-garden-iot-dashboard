<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1530">
<title>Smart Garden — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b1530;color:#f2eefc;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 0 40px rgba(139,92,246,.6)}
  h1{font-size:1.4rem;margin:20px 0 8px}
  p{opacity:.8;max-width:34ch;margin:0 auto 20px;line-height:1.5}
  button{background:#8b5cf6;color:#fff;border:0;border-radius:10px;padding:10px 18px;
    font-size:1rem;font-weight:600}
</style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="">
    <h1>Can't reach the garden</h1>
    <p>This device is offline or not on the same network as the garden dashboard. Alerts
      still arrive through the ntfy app.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
